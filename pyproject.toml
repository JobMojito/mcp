[project]
name = "jobmojito-mcp"
version = "0.1.0"
description = "JobMojito MCP server (FastMCP) — exposes the JobMojito API + documentation as MCP tools, secured with Supabase OAuth."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=3.4,<4",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

# Flat layout: all modules live at the repo root so Prefect Horizon can run
# `server.py:mcp` directly without an install/build step.
[tool.setuptools]
py-modules = [
    "server",
    "config",
    "openapi_loader",
    "naming",
    "upstream",
    "docs_tools",
    "featurebase",
    "mintlify",
    "ui_links",
]
