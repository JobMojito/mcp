[project]
name = "jobmojito-mcp"
dynamic = ["version"]
description = "JobMojito MCP server (FastMCP) — exposes the JobMojito API + documentation as MCP tools, secured with Supabase OAuth."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # 4.x = MCP SDK 2.x: protocol 2026-07-28 (server/discover, no sessions) beside the
    # older versions. <5 because lazy_auth.py hooks FastMCP internals.
    "fastmcp[apps]>=4.1.6,<5",
    "httpx2>=2.16",  # the HTTP client FastMCP 4 uses everywhere; ours too
    "python-dotenv>=1.2.4",
    "posthog>=7.86",  # MCP analytics + exception reporting; optional at runtime
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.4",
]

[tool.pytest.ini_options]
# pytest-asyncio 1.x warns when this is unset; one event loop per test, as before.
asyncio_default_fixture_loop_scope = "function"

# Flat layout: all modules live at the repo root so Prefect Horizon can run
# `server.py:mcp` directly without an install/build step.
# The version lives in exactly one hand-edited place: server.py:SERVER_VERSION.
# setuptools reads it by AST, without importing server.py — which matters,
# because importing it at build time would drag in fastmcp, httpx2 and the
# OpenAPI loader. That in turn is why SERVER_VERSION must stay a plain string
# literal: give it a computed value and setuptools silently falls back to
# importing the module, and the build breaks in a clean environment.
# server.json is the third copy and cannot be derived (mcp-publisher reads that
# file directly), so it is written by scripts/set_version.py rather than by hand.
[tool.setuptools.dynamic]
version = {attr = "server.SERVER_VERSION"}

[tool.setuptools]
py-modules = [
    "server",
    "config",
    "openapi_loader",
    "naming",
    "null_body_args",
    "raw_assessment",
    "upstream",
    "invitations",
    "media_upload",
    "docs_tools",
    "featurebase",
    "mintlify",
    "merchants",
    "middleware",
    "lazy_auth",
    "session_verifier",
    "wellknown",
    "posthog_analytics",
]
